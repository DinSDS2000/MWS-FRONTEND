version: 2.1.7

environment:
  sdk: ">=2.2.0 <3.0.0"
  # flutter: ^1.9.1

dependencies:
  flutter:
    sdk: flutter
  uuid: ^2.0.0
  get_version: ^0.0.8+5
  flutter_whatsnew: ^0.2.0+3
  native_widgets: ^1.0.1
  shared_preferences: ^0.5.1+1
